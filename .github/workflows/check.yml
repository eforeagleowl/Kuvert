# Runs Kuvert's checks: the service worker stamp, the unit tests (the save formats against fixtures
# recorded from Kuvert Classic) and the browser tests (Classic's saves and codes, offline, and the moves
# from older layouts, which need the full history).
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Service worker stamp is current
        run: node tools/stamp.mjs --check
      - name: Unit tests
        run: npm test
      - name: Browser tests
        run: npm run test:e2e
